services:
  # Backend - Spring Boot
  app:
    build:
      context: ./backend
    container_name: crud-springboot
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb+srv://usuariodobanco:senha@cluster0.datgvgs.mongodb.net/nomedobanco?retryWrites=true&w=majority

    networks:
      - app-network

  # Frontend - Angular com Nginx configurado para redirecionar /api para o backend
  frontend:
    build:
      context: ./frontend
    container_name: angular-app
    ports:
      - "4200:80"
    depends_on:
      - app
    networks:
      - app-network

  matricula-service:
    build:
      context: ./microservicos/matricula-service
    container_name: matricula-service
    ports:
      - "8081:8081"
    networks:
      - app-network

  pessoa-service:
    build:
      context: ./microservicos/pessoa-service
    container_name: pessoa-service
    ports:
      - "8082:8082"
    networks:
      - app-network

  curso-service:
    build:
      context: ./microservicos/curso-service
    container_name: curso-service
    ports:
      - "8083:8083"
    networks:
      - app-network

  disciplina-service:
    build:
      context: ./microservicos/disciplina-service
    container_name: disciplina-service
    ports:
      - "8084:8084"
    networks:
      - app-network

  professor-service:
    build:
      context: ./microservicos/professor-service
    container_name: professor-service
    ports:
      - "8085:8085"
    networks:
      - app-network

  turma-service:
    build:
      context: ./microservicos/turma-service
    container_name: turma-service
    ports:
      - "8086:8086"
    networks:
      - app-network

  gateway-service:
    build:
      context: ./microservicos/gateway-service
    container_name: gateway-service
    ports:
      - "8090:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
