server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para arquivos estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Arquivos estáticos do Angular — suporte ao roteamento client-side (HTML5)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend monolítico
    # /api/pessoas → http://app:8080/api/pessoas (mantém o prefixo /api/)
    location /api/ {
        proxy_pass         http://app:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Cache de arquivos estáticos com hash (Angular production build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desabilita logs para favicon (evita ruído)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
